<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interview Question Bank</title>

<style>
body { font-family: Arial; background:#f5f5f5; padding:20px; }

.header {
  display:flex; gap:10px; justify-content:center; margin-bottom:20px;
}

input, select {
  padding:10px; border-radius:6px; border:1px solid #ccc;
}

.card {
  background:white;
  margin:10px auto;
  padding:15px;
  border-radius:8px;
  width:800px;
  box-shadow:0 3px 10px rgba(0,0,0,0.15);
}

.question {
  font-weight:bold;
  cursor:pointer;
}

.answer {
  display:none;
  margin-top:10px;
}

.tag {
  font-size:12px;
  background:#007bff;
  color:white;
  padding:2px 6px;
  border-radius:4px;
  margin-left:10px;
}
</style>
</head>

<body>

<h2 style="text-align:center;">Interview Question Bank</h2>

<div class="header">
  <input placeholder="Search..." oninput="search(this.value)">
  
  <select onchange="filterCategory(this.value)">
    <option value="">All</option>
    <option value="ANGULAR">Angular</option>
    <option value="BQ">BQ</option>
  </select>

  <select onchange="filterMode(this.value)">
    <option value="">All</option>
    <option value="fav">⭐ Favorite</option>
    <option value="unknown">❌ 不熟</option>
  </select>
</div>

<div id="list"></div>

<script>
let originalData = [];
let data = [];

let favorites = new Set(JSON.parse(localStorage.getItem('fav') || '[]'));
let stats = JSON.parse(localStorage.getItem('stats') || '{}');

// 加载 faq.json（你的唯一数据源） :contentReference[oaicite:0]{index=0}
fetch('faq.json')
  .then(res => res.json())
  .then(json => {
    originalData = json.map(item => ({
      id: item.id,
      question: item.question,
      answer: cleanHTML(item.answer),
      category: item.category
    }));

    data = [...originalData];
    render();
  });

// 清理HTML
function cleanHTML(html) {
  return html.replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
}

// 渲染
function render() {
  const container = document.getElementById("list");
  container.innerHTML = "";

  data.forEach(item => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="question" onclick="toggle(${item.id})">
        ▶ ${item.question}
        <span class="tag">${item.category}</span>
      </div>

      <div class="answer" id="a-${item.id}">
        ${item.answer}
        <br><br>
        <button onclick="toggleFav(${item.id})">
          ${favorites.has(item.id) ? "⭐ Saved" : "⭐"}
        </button>

        <button onclick="mark(${item.id}, 'known')">✔ 熟</button>
        <button onclick="mark(${item.id}, 'unknown')">❌ 不熟</button>
      </div>
    `;

    container.appendChild(div);
  });
}

// 展开
function toggle(id) {
  const el = document.getElementById(`a-${id}`);
  el.style.display = el.style.display === "block" ? "none" : "block";
}

// 收藏
function toggleFav(id) {
  if (favorites.has(id)) favorites.delete(id);
  else favorites.add(id);

  localStorage.setItem('fav', JSON.stringify([...favorites]));
  render();
}

// 标记
function mark(id, type) {
  stats[id] = type;
  localStorage.setItem('stats', JSON.stringify(stats));
  render();
}

// 搜索
function search(keyword) {
  keyword = keyword.toLowerCase();
  data = originalData.filter(item =>
    item.question.toLowerCase().includes(keyword)
  );
  render();
}

// 分类筛选
function filterCategory(cat) {
  data = cat
    ? originalData.filter(item => item.category === cat)
    : [...originalData];

  render();
}

// 模式筛选
function filterMode(mode) {
  if (mode === "fav") {
    data = originalData.filter(item => favorites.has(item.id));
  } else if (mode === "unknown") {
    data = originalData.filter(item => stats[item.id] === "unknown");
  } else {
    data = [...originalData];
  }

  render();
}
</script>

</body>
</html>
